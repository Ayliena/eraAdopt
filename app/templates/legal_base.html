<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %} - ERA Adoptions</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=static_v('css/style.css')) }}">
</head>
<body>
{% include '_user_bar.html' %}

  <!-- En-tête -->
  <header class="site-header">
    <div class="header-container">
{% include '_brand.html' %}
      <a href="/" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Retour aux adoptions</span>
      </a>
    </div>
  </header>

  <main class="legal-main">
    <h1>{{ self.title() }}</h1>
    <p class="legal-updated">Dernière mise à jour : {% block updated %}{% endblock %}</p>
    {% block content %}{% endblock %}
  </main>

{% include '_footer.html' %}

</body>
</html>
